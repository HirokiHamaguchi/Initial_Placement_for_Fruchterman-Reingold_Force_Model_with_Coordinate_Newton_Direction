repos:
  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.15.0
    hooks:
      - id: ruff
        args: [--fix]
        files: ^(src|doc)/

  - repo: local
    hooks:
      - id: ty
        name: ty
        language: system
        entry: uvx ty check
        args: [--ignore, unused-type-ignore-comment, src, doc]
        pass_filenames: false

      - id: pyright
        name: pyright (Pylance-compatible)
        language: system
        entry: uv run pyright
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=10000]
        exclude: ^doc/.*\.pdf$
      - id: check-json
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
